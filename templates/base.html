<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Vehicle Maintenance Tracker{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="desktop-view">
    <header>
        <div class="header-content">
            <h1>🚗 Vehicle Maintenance Tracker</h1>
            <button class="view-toggle" onclick="toggleView()">Switch to Mobile</button>
        </div>
    </header>

    <nav>
        <div class="nav-container">
            <ul class="nav-menu">
                <li><a href="/">Dashboard</a></li>
                <li><a href="/vehicle">Vehicle Profile</a></li>
                <li><a href="/services">Service Records</a></li>
                <li><a href="/supplies">Supplies</a></li>
                <li><a href="/fuel">Fuel Tracker</a></li>
                <li><a href="/reminders">Reminders</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
