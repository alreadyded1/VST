<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Report - VehicleTracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --accent: #6366f1;
            --text: #0f172a;
            --muted: #64748b;
            --border: #e2e8f0;
            --bg: #f8fafc;
            --font: 'Inter', system-ui, sans-serif;
        }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            font-size: 14px;
            line-height: 1.5;
        }

        /* Toolbar (hidden on print) */
        .toolbar {
            background: #0f172a;
            color: #f8fafc;
            padding: 0.75rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .toolbar a {
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .toolbar a:hover { color: #f8fafc; }

        .toolbar-title {
            font-weight: 600;
            font-size: 0.95rem;
            flex: 1;
        }

        .toolbar-actions { display: flex; gap: 0.75rem; }

        .btn-print, .btn-csv {
            padding: 0.45rem 1rem;
            border-radius: 6px;
            font-size: 0.82rem;
            font-weight: 600;
            font-family: var(--font);
            cursor: pointer;
            border: none;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .btn-print {
            background: var(--accent);
            color: #fff;
        }
        .btn-print:hover { background: #4f46e5; }

        .btn-csv {
            background: rgba(255,255,255,0.1);
            color: #f8fafc;
            border: 1px solid rgba(255,255,255,0.15);
        }
        .btn-csv:hover { background: rgba(255,255,255,0.18); }

        /* Report body */
        .report-container {
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 1.5rem 4rem;
        }

        /* Report header */
        .report-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 2rem;
            padding-bottom: 1.25rem;
            border-bottom: 2px solid var(--accent);
        }

        .report-title {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text);
        }

        .report-meta {
            font-size: 0.8rem;
            color: var(--muted);
            margin-top: 0.25rem;
        }

        .report-logo {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--accent);
            text-align: right;
        }

        /* Vehicle summary card */
        .vehicle-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .summary-card {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
        }

        .summary-card .label {
            font-size: 0.72rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--muted);
            margin-bottom: 0.3rem;
        }

        .summary-card .value {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text);
        }

        .summary-card .sub {
            font-size: 0.75rem;
            color: var(--muted);
        }

        /* Section */
        .section {
            margin-bottom: 2.5rem;
        }

        .section-title {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 0.75rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .section-count {
            font-size: 0.72rem;
            font-weight: 600;
            background: rgba(99,102,241,0.1);
            color: var(--accent);
            padding: 0.15rem 0.5rem;
            border-radius: 10px;
        }

        /* Tables */
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.82rem;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
        }

        thead {
            background: #f1f5f9;
        }

        th {
            text-align: left;
            padding: 0.55rem 0.75rem;
            font-size: 0.72rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--muted);
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }

        td {
            padding: 0.5rem 0.75rem;
            border-bottom: 1px solid #f1f5f9;
            vertical-align: top;
        }

        tr:last-child td { border-bottom: none; }
        tr:hover td { background: #fafafa; }

        .empty-msg {
            text-align: center;
            color: var(--muted);
            font-size: 0.82rem;
            padding: 1.5rem;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 8px;
        }

        .loading-msg {
            text-align: center;
            color: var(--muted);
            font-size: 0.82rem;
            padding: 1.5rem;
        }

        /* Vehicle selector */
        .vehicle-selector-bar {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.75rem 1rem;
        }

        .vehicle-selector-bar label {
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--muted);
            white-space: nowrap;
        }

        .vehicle-selector-bar select {
            flex: 1;
            padding: 0.4rem 0.6rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-family: var(--font);
            font-size: 0.875rem;
            color: var(--text);
            background: #fff;
        }

        .vehicle-selector-bar select:focus {
            outline: none;
            border-color: var(--accent);
        }

        /* Status badges */
        .badge {
            display: inline-block;
            padding: 0.15rem 0.5rem;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        .badge-pending { background: #fef9c3; color: #854d0e; }
        .badge-done { background: #dcfce7; color: #166534; }

        /* Print styles */
        @media print {
            .toolbar { display: none !important; }
            .vehicle-selector-bar { display: none !important; }

            body { background: #fff; font-size: 11px; }

            .report-container {
                max-width: 100%;
                margin: 0;
                padding: 0.5rem 1rem 2rem;
            }

            .report-header { margin-bottom: 1rem; }

            .section { margin-bottom: 1.5rem; page-break-inside: avoid; }

            table { page-break-inside: auto; font-size: 10px; }
            tr { page-break-inside: avoid; }

            .summary-card { border: 1px solid #ddd; }

            a { color: inherit; text-decoration: none; }
        }

        @media (max-width: 600px) {
            .report-header { flex-direction: column; gap: 0.5rem; }
            .vehicle-summary { grid-template-columns: 1fr 1fr; }
            .toolbar-actions .btn-csv { display: none; }
        }
    </style>
</head>
<body>

<div class="toolbar no-print">
    <a href="/">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Back to Dashboard
    </a>
    <span class="toolbar-title">Vehicle Report</span>
    <div class="toolbar-actions">
        <button class="btn-csv" onclick="exportCSV('services')">
            <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Services CSV
        </button>
        <button class="btn-csv" onclick="exportCSV('fuel')">
            <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Fuel CSV
        </button>
        <button class="btn-csv" onclick="exportCSV('supplies')">
            <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Supplies CSV
        </button>
        <button class="btn-print" onclick="window.print()">
            <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
            Print / Save PDF
        </button>
    </div>
</div>

<div class="report-container">

    <div class="vehicle-selector-bar no-print">
        <label>Vehicle:</label>
        <select id="vehicleSelect" onchange="loadReport()">
            <option value="">Loading...</option>
        </select>
    </div>

    <div id="reportContent" style="display:none;">

        <div class="report-header">
            <div>
                <div class="report-title" id="reportVehicleName">Vehicle Report</div>
                <div class="report-meta" id="reportMeta"></div>
            </div>
            <div class="report-logo">VehicleTracker</div>
        </div>

        <!-- Summary Cards -->
        <div class="vehicle-summary" id="summaryCards"></div>

        <!-- Service Records -->
        <div class="section">
            <div class="section-title">
                Service Records
                <span class="section-count" id="serviceCount">0</span>
            </div>
            <div id="servicesSection"><div class="loading-msg">Loading...</div></div>
        </div>

        <!-- Fuel Records -->
        <div class="section">
            <div class="section-title">
                Fuel Records
                <span class="section-count" id="fuelCount">0</span>
            </div>
            <div id="fuelSection"><div class="loading-msg">Loading...</div></div>
        </div>

        <!-- Supplies -->
        <div class="section">
            <div class="section-title">
                Parts & Supplies
                <span class="section-count" id="suppliesCount">0</span>
            </div>
            <div id="suppliesSection"><div class="loading-msg">Loading...</div></div>
        </div>

        <!-- Reminders -->
        <div class="section">
            <div class="section-title">
                Maintenance Reminders
                <span class="section-count" id="remindersCount">0</span>
            </div>
            <div id="remindersSection"><div class="loading-msg">Loading...</div></div>
        </div>

    </div><!-- /reportContent -->

    <div id="noVehicleMsg" style="display:none;" class="empty-msg">No vehicles found. Add a vehicle first.</div>

</div><!-- /report-container -->

<script>
let currentVehicleId = null;

async function init() {
    const res = await fetch('/api/vehicles');
    const vehicles = await res.json();
    const sel = document.getElementById('vehicleSelect');
    sel.innerHTML = '';
    if (!vehicles.length) {
        document.getElementById('noVehicleMsg').style.display = 'block';
        return;
    }
    vehicles.forEach(v => {
        const opt = document.createElement('option');
        opt.value = v.id;
        opt.textContent = `${v.year} ${v.make} ${v.model}`;
        sel.appendChild(opt);
    });
    // Try to match localStorage vehicle
    const saved = localStorage.getItem('selectedVehicleId');
    if (saved && vehicles.find(v => String(v.id) === saved)) {
        sel.value = saved;
    }
    loadReport();
}

async function loadReport() {
    const sel = document.getElementById('vehicleSelect');
    currentVehicleId = sel.value;
    if (!currentVehicleId) return;

    document.getElementById('reportContent').style.display = 'block';
    document.getElementById('noVehicleMsg').style.display = 'none';

    // Vehicle name from select
    const vehicleName = sel.options[sel.selectedIndex].textContent;
    document.getElementById('reportVehicleName').textContent = vehicleName;
    document.getElementById('reportMeta').textContent = 'Generated ' + new Date().toLocaleDateString('en-US', {
        year: 'numeric', month: 'long', day: 'numeric'
    });

    await Promise.all([loadServices(), loadFuel(), loadSupplies(), loadReminders()]);
    loadStats();
}

async function loadStats() {
    const res = await fetch(`/api/stats?vehicle_id=${currentVehicleId}`);
    const s = await res.json();

    // Also get fuel count and supplies count from already-rendered tables
    const serviceRows = document.querySelectorAll('#servicesSection table tbody tr').length;
    const fuelRows = document.querySelectorAll('#fuelSection table tbody tr').length;
    const suppliesRows = document.querySelectorAll('#suppliesSection table tbody tr').length;

    const cards = [
        { label: 'Total Services', value: s.total_services },
        { label: 'Total Spent', value: '$' + Number(s.total_spent).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2}) },
        { label: 'Avg Fuel Economy', value: s.avg_mpg ? s.avg_mpg + ' MPG' : '—' },
        { label: 'Fuel Records', value: fuelRows },
        { label: 'Parts & Supplies', value: suppliesRows },
        { label: 'Pending Reminders', value: s.pending_reminders }
    ];

    document.getElementById('summaryCards').innerHTML = cards.map(c => `
        <div class="summary-card">
            <div class="label">${c.label}</div>
            <div class="value">${c.value}</div>
        </div>
    `).join('');
}

async function loadServices() {
    const res = await fetch(`/api/services?vehicle_id=${currentVehicleId}`);
    const services = await res.json();
    document.getElementById('serviceCount').textContent = services.length;

    if (!services.length) {
        document.getElementById('servicesSection').innerHTML = '<div class="empty-msg">No service records found.</div>';
        return;
    }

    const rows = services.map(s => `
        <tr>
            <td>${s.date || ''}</td>
            <td>${esc(s.service_provider || '')}</td>
            <td>${s.odometer ? Number(s.odometer).toLocaleString() : '—'}</td>
            <td>${esc(s.repairs_completed || '')}</td>
            <td>$${Number(s.cost || 0).toFixed(2)}</td>
            <td>${esc(s.comments || '')}</td>
        </tr>
    `).join('');

    document.getElementById('servicesSection').innerHTML = `
        <table>
            <thead><tr>
                <th>Date</th><th>Provider</th><th>Odometer</th>
                <th>Work Done</th><th>Cost</th><th>Notes</th>
            </tr></thead>
            <tbody>${rows}</tbody>
        </table>
    `;
}

async function loadFuel() {
    const res = await fetch(`/api/fuel?vehicle_id=${currentVehicleId}`);
    const records = await res.json();
    // Handle both paginated and non-paginated response
    const fuel = Array.isArray(records) ? records : (records.data || []);
    document.getElementById('fuelCount').textContent = fuel.length;

    if (!fuel.length) {
        document.getElementById('fuelSection').innerHTML = '<div class="empty-msg">No fuel records found.</div>';
        return;
    }

    const rows = fuel.map(f => `
        <tr>
            <td>${f.date || ''}</td>
            <td>${f.odometer ? Number(f.odometer).toLocaleString() : '—'}</td>
            <td>${f.gallons ? Number(f.gallons).toFixed(3) : '—'}</td>
            <td>$${Number(f.cost || 0).toFixed(2)}</td>
            <td>${f.cost && f.gallons ? '$' + (f.cost / f.gallons).toFixed(3) : '—'}</td>
            <td>${esc(f.station || '')}</td>
            <td>${f.mpg ? Number(f.mpg).toFixed(1) : '—'}</td>
        </tr>
    `).join('');

    document.getElementById('fuelSection').innerHTML = `
        <table>
            <thead><tr>
                <th>Date</th><th>Odometer</th><th>Gallons</th>
                <th>Total Cost</th><th>Price/Gal</th><th>Station</th><th>MPG</th>
            </tr></thead>
            <tbody>${rows}</tbody>
        </table>
    `;
}

async function loadSupplies() {
    const res = await fetch(`/api/supplies?vehicle_id=${currentVehicleId}`);
    const supplies = await res.json();
    document.getElementById('suppliesCount').textContent = supplies.length;

    if (!supplies.length) {
        document.getElementById('suppliesSection').innerHTML = '<div class="empty-msg">No supplies found.</div>';
        return;
    }

    const rows = supplies.map(s => `
        <tr>
            <td>${esc(s.name || '')}</td>
            <td>${esc(s.brand || '')}</td>
            <td>${esc(s.part_number || '')}</td>
            <td>${esc(s.category || '')}</td>
            <td>${s.quantity}</td>
            <td>$${Number(s.cost || 0).toFixed(2)}</td>
            <td>${esc(s.condition || '')}</td>
            <td>${esc(s.location || '')}</td>
        </tr>
    `).join('');

    document.getElementById('suppliesSection').innerHTML = `
        <table>
            <thead><tr>
                <th>Name</th><th>Brand</th><th>Part #</th>
                <th>Category</th><th>Qty</th><th>Cost</th>
                <th>Condition</th><th>Location</th>
            </tr></thead>
            <tbody>${rows}</tbody>
        </table>
    `;
}

async function loadReminders() {
    const res = await fetch(`/api/reminders?vehicle_id=${currentVehicleId}`);
    const reminders = await res.json();
    document.getElementById('remindersCount').textContent = reminders.length;

    if (!reminders.length) {
        document.getElementById('remindersSection').innerHTML = '<div class="empty-msg">No reminders found.</div>';
        return;
    }

    const rows = reminders.map(r => `
        <tr>
            <td>${esc(r.service_type || '')}</td>
            <td>${r.due_date || '—'}</td>
            <td>${r.due_mileage ? Number(r.due_mileage).toLocaleString() + ' mi' : '—'}</td>
            <td>${esc(r.notes || '')}</td>
            <td><span class="badge ${r.completed ? 'badge-done' : 'badge-pending'}">${r.completed ? 'Done' : 'Pending'}</span></td>
        </tr>
    `).join('');

    document.getElementById('remindersSection').innerHTML = `
        <table>
            <thead><tr>
                <th>Service</th><th>Due Date</th><th>Due Mileage</th>
                <th>Notes</th><th>Status</th>
            </tr></thead>
            <tbody>${rows}</tbody>
        </table>
    `;
}

function exportCSV(type) {
    if (!currentVehicleId) return;
    const urls = {
        services: `/api/services/export-csv?vehicle_id=${currentVehicleId}`,
        fuel: `/api/fuel/export-csv?vehicle_id=${currentVehicleId}`,
        supplies: `/api/supplies/export-csv?vehicle_id=${currentVehicleId}`
    };
    window.location.href = urls[type];
}

function esc(str) {
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
}

init();
</script>
</body>
</html>
