{% extends "base.html" %}

{% block title %}Vehicles - Vehicle Maintenance Tracker{% endblock %}

{% block content %}
<style>
/* View modal label styling */
#viewVehicleModal .form-group label {
    font-weight: bold;
}
</style>

<h1>My Vehicles</h1>

<div class="card">
    <div class="flex-between mb-2">
        <h2>Vehicle List</h2>
        <button class="btn btn-primary" onclick="openModal('addVehicleModal')">Add Vehicle</button>
    </div>

    <div id="vehiclesList">
        <p>Loading...</p>
    </div>
</div>

<!-- Add/Edit Vehicle Modal -->
<div id="addVehicleModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="modalTitle">Add Vehicle</h3>
            <button class="close" onclick="closeModal('addVehicleModal')">&times;</button>
        </div>
        <form id="vehicleForm" onsubmit="saveVehicle(event)">
            <input type="hidden" id="vehicleId">

            <div class="form-row">
                <div class="form-group">
                    <label for="manufacturer">Manufacturer *</label>
                    <input type="text" id="manufacturer" name="manufacturer" required>
                </div>
                <div class="form-group">
                    <label for="model">Model *</label>
                    <input type="text" id="model" name="model" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="year">Year *</label>
                    <input type="number" id="year" name="year" min="1900" max="2100" required>
                </div>
                <div class="form-group">
                    <label for="engine">Engine</label>
                    <input type="text" id="engine" name="engine" placeholder="e.g., 2.0L Turbo">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="vin">VIN</label>
                    <input type="text" id="vin" name="vin" maxlength="17" placeholder="17-character VIN">
                </div>
                <div class="form-group">
                    <label for="nickname">Nickname</label>
                    <input type="text" id="nickname" name="nickname" placeholder="e.g., The Beast">
                </div>
            </div>

            <div class="form-group">
                <label for="picture">Vehicle Picture</label>
                <input type="file" id="picture" name="picture" accept="image/*" onchange="handleFilePreview(this, 'picturePreview')">
                <div id="picturePreview" class="file-preview"></div>
            </div>

            <button type="submit" class="btn btn-success">Save Vehicle</button>
        </form>
    </div>
</div>

<!-- View Vehicle Modal -->
<div id="viewVehicleModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Vehicle Details</h3>
            <button class="close" onclick="closeModal('viewVehicleModal')">&times;</button>
        </div>
        <div class="modal-body">
            <div id="viewVehicleImage" style="margin-bottom: 1rem;"></div>

            <div class="form-row">
                <div class="form-group">
                    <label>Nickname:</label>
                    <p id="viewNickname"></p>
                </div>
                <div class="form-group">
                    <label>Year:</label>
                    <p id="viewYear"></p>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Manufacturer:</label>
                    <p id="viewManufacturer"></p>
                </div>
                <div class="form-group">
                    <label>Model:</label>
                    <p id="viewModel"></p>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Engine:</label>
                    <p id="viewEngine"></p>
                </div>
                <div class="form-group">
                    <label>VIN:</label>
                    <p id="viewVIN"></p>
                </div>
            </div>

            <div class="form-group">
                <label>Created:</label>
                <p id="viewCreated"></p>
            </div>

            <div style="margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid var(--border-color);">
                <h4 style="margin-bottom: 1rem;">NHTSA Services</h4>
                <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
                    <button class="btn btn-secondary" onclick="decodeVINFromView()" id="decodeVINBtn">Decode VIN</button>
                    <button class="btn btn-secondary" onclick="checkRecallsFromView()" id="checkRecallsBtn">Check Recalls</button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- VIN Decode Results Modal -->
<div id="vinDecodeModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>VIN Decode Results</h3>
            <button class="close" onclick="closeModal('vinDecodeModal')">&times;</button>
        </div>
        <div class="modal-body">
            <div id="vinDecodeResults"></div>
        </div>
    </div>
</div>

<!-- Recalls Results Modal -->
<div id="recallsModal" class="modal">
    <div class="modal-content" style="max-width: 800px;">
        <div class="modal-header">
            <h3>Vehicle Recalls</h3>
            <button class="close" onclick="closeModal('recallsModal')">&times;</button>
        </div>
        <div class="modal-body">
            <div id="recallsResults"></div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let allVehicles = [];

async function loadVehicles() {
    try {
        const vehicles = await fetchAPI('/api/vehicles');
        allVehicles = vehicles;
        displayVehicles(vehicles);
    } catch (error) {
        console.error('Error loading vehicles:', error);
        document.getElementById('vehiclesList').innerHTML = '<p>Error loading vehicles</p>';
    }
}

function displayVehicles(vehicles) {
    const container = document.getElementById('vehiclesList');

    if (vehicles.length === 0) {
        container.innerHTML = '<p>No vehicles yet. Click "Add Vehicle" to create one.</p>';
        return;
    }

    let html = '<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem;">';

    vehicles.forEach(vehicle => {
        const nickname = vehicle.nickname || `${vehicle.year} ${vehicle.manufacturer} ${vehicle.model}`;
        const imageSrc = vehicle.picture ? `/static/${vehicle.picture}` : '';

        html += `
            <div class="card" style="margin: 0;">
                ${imageSrc ? `<img src="${imageSrc}" style="width: 100%; height: 200px; object-fit: cover; border-radius: 8px 8px 0 0;">` :
                            `<div style="width: 100%; height: 200px; background: var(--light-bg); display: flex; align-items: center; justify-content: center; color: var(--light-text); border-radius: 8px 8px 0 0;">No Image</div>`}
                <div style="padding: 1rem;">
                    <h3 style="margin-bottom: 0.5rem;">${nickname}</h3>
                    <p><strong>${vehicle.year} ${vehicle.manufacturer} ${vehicle.model}</strong></p>
                    ${vehicle.engine ? `<p>Engine: ${vehicle.engine}</p>` : ''}
                    ${vehicle.vin ? `<p><small>VIN: ${vehicle.vin}</small></p>` : ''}
                    <div style="margin-top: 1rem; display: flex; gap: 0.5rem; flex-wrap: wrap;">
                        <button class="btn btn-small btn-secondary" onclick="viewVehicle(${vehicle.id})">View</button>
                        <button class="btn btn-small btn-secondary" onclick="editVehicle(${vehicle.id})">Edit</button>
                        <button class="btn btn-small btn-primary" onclick="selectVehicle(${vehicle.id})">Select</button>
                        <button class="btn btn-small btn-danger" onclick="deleteVehicle(${vehicle.id})">Delete</button>
                    </div>
                </div>
            </div>
        `;
    });

    html += '</div>';
    container.innerHTML = html;
}

function selectVehicle(vehicleId) {
    setCurrentVehicleId(vehicleId);
    showAlert('Vehicle selected! Redirecting to dashboard...', 'success');
    setTimeout(() => {
        window.location.href = '/';
    }, 1000);
}

function viewVehicle(vehicleId) {
    const vehicle = allVehicles.find(v => v.id === vehicleId);
    if (!vehicle) return;

    // Store current vehicle for NHTSA functions
    currentViewVehicle = vehicle;

    // Display vehicle image
    const imageContainer = document.getElementById('viewVehicleImage');
    if (vehicle.picture) {
        imageContainer.innerHTML = `<img src="/static/${vehicle.picture}" style="width: 100%; max-height: 300px; object-fit: cover; border-radius: 8px;">`;
    } else {
        imageContainer.innerHTML = '<div style="width: 100%; height: 200px; background: var(--light-bg); display: flex; align-items: center; justify-content: center; color: var(--light-text); border-radius: 8px;">No Image</div>';
    }

    // Populate vehicle details
    document.getElementById('viewNickname').textContent = vehicle.nickname || 'N/A';
    document.getElementById('viewYear').textContent = vehicle.year;
    document.getElementById('viewManufacturer').textContent = vehicle.manufacturer;
    document.getElementById('viewModel').textContent = vehicle.model;
    document.getElementById('viewEngine').textContent = vehicle.engine || 'N/A';
    document.getElementById('viewVIN').textContent = vehicle.vin || 'N/A';

    // Format created_at date if available
    if (vehicle.created_at) {
        const createdDate = new Date(vehicle.created_at);
        document.getElementById('viewCreated').textContent = createdDate.toLocaleString('en-US', {
            year: 'numeric',
            month: 'long',
            day: 'numeric',
            hour: '2-digit',
            minute: '2-digit'
        });
    } else {
        document.getElementById('viewCreated').textContent = 'N/A';
    }

    openModal('viewVehicleModal');
}

function editVehicle(vehicleId) {
    const vehicle = allVehicles.find(v => v.id === vehicleId);
    if (!vehicle) return;

    document.getElementById('modalTitle').textContent = 'Edit Vehicle';
    document.getElementById('vehicleId').value = vehicle.id;
    document.getElementById('manufacturer').value = vehicle.manufacturer;
    document.getElementById('model').value = vehicle.model;
    document.getElementById('year').value = vehicle.year;
    document.getElementById('engine').value = vehicle.engine || '';
    document.getElementById('vin').value = vehicle.vin || '';
    document.getElementById('nickname').value = vehicle.nickname || '';

    openModal('addVehicleModal');
}

async function saveVehicle(event) {
    event.preventDefault();

    const form = document.getElementById('vehicleForm');
    const formData = new FormData(form);
    const vehicleId = document.getElementById('vehicleId').value;

    try {
        let result;
        if (vehicleId) {
            // Update existing vehicle using PUT
            result = await putFormData(`/api/vehicle/${vehicleId}`, formData);
        } else {
            // Add new vehicle
            result = await postFormData('/api/vehicle', formData);

            // Auto-select newly created vehicle
            if (result.success && result.id) {
                setCurrentVehicleId(result.id);
            }
        }

        if (result.success) {
            showAlert(vehicleId ? 'Vehicle updated successfully!' : 'Vehicle added successfully!', 'success');
            form.reset();
            document.getElementById('picturePreview').textContent = '';
            document.getElementById('vehicleId').value = '';
            document.getElementById('modalTitle').textContent = 'Add Vehicle';
            closeModal('addVehicleModal');
            await loadVehicles();
            await loadVehicleSelector();
        }
    } catch (error) {
        console.error('Error saving vehicle:', error);
    }
}

async function deleteVehicle(vehicleId) {
    if (!confirm('Are you sure you want to delete this vehicle? This will also delete all associated records (services, supplies, fuel, reminders).')) {
        return;
    }

    try {
        await deleteAPI(`/api/vehicle/${vehicleId}`);
        showAlert('Vehicle deleted successfully!', 'success');

        // If this was the selected vehicle, clear selection
        if (getCurrentVehicleId() == vehicleId) {
            localStorage.removeItem('currentVehicleId');
        }

        await loadVehicles();
        await loadVehicleSelector();
    } catch (error) {
        console.error('Error deleting vehicle:', error);
    }
}

// NHTSA Integration Functions
let currentViewVehicle = null;

async function decodeVINFromView() {
    if (!currentViewVehicle || !currentViewVehicle.vin) {
        showAlert('No VIN available for this vehicle', 'error');
        return;
    }

    const btn = document.getElementById('decodeVINBtn');
    btn.disabled = true;
    btn.textContent = 'Decoding...';

    try {
        const response = await fetchAPI(`/api/vehicle/decode-vin/${currentViewVehicle.vin}`);

        if (response.success && response.data) {
            displayVINDecodeResults(response.data);
            openModal('vinDecodeModal');
        } else {
            showAlert(response.error || 'Failed to decode VIN', 'error');
        }
    } catch (error) {
        console.error('Error decoding VIN:', error);
        showAlert('Error decoding VIN', 'error');
    } finally {
        btn.disabled = false;
        btn.textContent = 'Decode VIN';
    }
}

function displayVINDecodeResults(data) {
    const container = document.getElementById('vinDecodeResults');

    let html = '<div style="display: grid; gap: 1rem;">';

    // Check for errors
    if (data.error_codes && data.error_codes !== '0') {
        html += `<div class="alert alert-warning" style="padding: 1rem; background: var(--warning-color); color: white; border-radius: 8px;">
            <strong>Warning:</strong> ${data.error_text || 'Some errors occurred during decoding'}
        </div>`;
    }

    // Display vehicle information
    html += '<div class="form-row">';
    html += `<div class="form-group"><label>VIN:</label><p>${data.vin || 'N/A'}</p></div>`;
    html += `<div class="form-group"><label>Year:</label><p>${data.year || 'N/A'}</p></div>`;
    html += '</div>';

    html += '<div class="form-row">';
    html += `<div class="form-group"><label>Manufacturer:</label><p>${data.manufacturer || 'N/A'}</p></div>`;
    html += `<div class="form-group"><label>Model:</label><p>${data.model || 'N/A'}</p></div>`;
    html += '</div>';

    html += '<div class="form-row">';
    html += `<div class="form-group"><label>Body Type:</label><p>${data.body_type || 'N/A'}</p></div>`;
    html += `<div class="form-group"><label>Vehicle Type:</label><p>${data.vehicle_type || 'N/A'}</p></div>`;
    html += '</div>';

    html += '<div class="form-row">';
    html += `<div class="form-group"><label>Engine:</label><p>${data.engine || 'N/A'}</p></div>`;
    html += '</div>';

    // Plant information
    if (data.plant_city || data.plant_state || data.plant_country) {
        html += '<div style="margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--border-color);">';
        html += '<h4>Manufacturing Plant</h4>';
        html += '<div class="form-row">';
        html += `<div class="form-group"><label>City:</label><p>${data.plant_city || 'N/A'}</p></div>`;
        html += `<div class="form-group"><label>State:</label><p>${data.plant_state || 'N/A'}</p></div>`;
        html += `<div class="form-group"><label>Country:</label><p>${data.plant_country || 'N/A'}</p></div>`;
        html += '</div>';
        html += '</div>';
    }

    html += '</div>';
    container.innerHTML = html;
}

async function checkRecallsFromView() {
    if (!currentViewVehicle) {
        showAlert('No vehicle selected', 'error');
        return;
    }

    const btn = document.getElementById('checkRecallsBtn');
    btn.disabled = true;
    btn.textContent = 'Checking...';

    try {
        const response = await fetchAPI(`/api/vehicle/recalls?make=${encodeURIComponent(currentViewVehicle.manufacturer)}&model=${encodeURIComponent(currentViewVehicle.model)}&year=${currentViewVehicle.year}`);

        if (response.success) {
            displayRecallResults(response);
            openModal('recallsModal');
        } else {
            showAlert(response.error || 'Failed to check recalls', 'error');
        }
    } catch (error) {
        console.error('Error checking recalls:', error);
        showAlert('Error checking recalls', 'error');
    } finally {
        btn.disabled = false;
        btn.textContent = 'Check Recalls';
    }
}

function displayRecallResults(response) {
    const container = document.getElementById('recallsResults');

    let html = '';

    if (response.count === 0) {
        html = `<div class="alert alert-success" style="padding: 1.5rem; background: var(--success-color); color: white; border-radius: 8px; text-align: center;">
            <h3 style="margin-bottom: 0.5rem;">No Recalls Found</h3>
            <p>Great news! No recalls were found for this vehicle.</p>
        </div>`;
    } else {
        html = `<div class="alert alert-danger" style="padding: 1rem; background: var(--danger-color); color: white; border-radius: 8px; margin-bottom: 1rem;">
            <strong>⚠ ${response.count} Recall${response.count > 1 ? 's' : ''} Found</strong>
        </div>`;

        response.recalls.forEach((recall, index) => {
            html += `<div class="card" style="margin-bottom: 1rem; border-left: 4px solid var(--danger-color);">
                <h4 style="margin-bottom: 0.5rem;">Recall #${index + 1}: ${recall.nhtsa_campaign_number}</h4>
                <p><strong>Manufacturer:</strong> ${recall.manufacturer}</p>
                <p><strong>Component:</strong> ${recall.component || 'N/A'}</p>
                <p><strong>Report Date:</strong> ${recall.report_date || 'N/A'}</p>

                <div style="margin-top: 1rem;">
                    <p><strong>Subject:</strong></p>
                    <p>${recall.subject || 'N/A'}</p>
                </div>

                <div style="margin-top: 1rem;">
                    <p><strong>Summary:</strong></p>
                    <p>${recall.summary || 'N/A'}</p>
                </div>

                ${recall.consequence ? `
                <div style="margin-top: 1rem;">
                    <p><strong>Consequence:</strong></p>
                    <p>${recall.consequence}</p>
                </div>
                ` : ''}

                ${recall.remedy ? `
                <div style="margin-top: 1rem;">
                    <p><strong>Remedy:</strong></p>
                    <p>${recall.remedy}</p>
                </div>
                ` : ''}
            </div>`;
        });
    }

    container.innerHTML = html;
}

document.addEventListener('DOMContentLoaded', loadVehicles);
</script>
{% endblock %}
